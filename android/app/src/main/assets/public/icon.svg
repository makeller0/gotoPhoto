    <text x="0" y="12" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="4">WATERMARK</text>
  </g>
</svg>
