name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本号 (Release Tag，如 v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Android platform with Capacitor..."
            npx cap add android
          fi
          echo "Syncing web assets to native Android project..."
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-assets/watermark-app.apk \;
          if [ ! -f release-assets/watermark-app.apk ]; then
            echo "❌ 错误：未能在构建目录中找到生成的 APK 文件！"
            exit 1
          fi
          echo "✅ 成功生成 APK 文件："
          ls -lh release-assets/watermark-app.apk

      - name: Upload APK to Job Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watermark-app-apk
          path: release-assets/watermark-app.apk
          retention-days: 30

      - name: Calculate Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target release tag is: $TAG"

      - name: Publish APK to GitHub Release
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "水印添加器 ${{ steps.release_info.outputs.tag }}"
          body: |
            ## 📱 水印添加器 Android 原生 APK 安装包

            本安装包由 GitHub Actions 自动化编译流水线生成。

            ### 🚀 安装方式
            1. 在下方 **Assets** 附件列表中点击下载 **`watermark-app.apk`**
            2. 在安卓手机打开并授权安装（允许来自此来源的应用）
            3. 支持离线运行、照片批量加水印、自定义图片与文字、无损保留原图 EXIF/GPS 元数据

            ---
            *构建时间: ${{ github.event.head_commit.timestamp || 'Latest' }} | 提交: ${{ github.sha }}*
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/watermark-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Upload Status Check
        if: steps.create_release.outcome == 'failure'
        run: |
          echo "::warning::GitHub Releases 自动发布因仓库 Token 权限受限跳过。但 APK 已 100% 成功编译，并已保存到当前 Actions 运行结果顶部的 'Artifacts' (工件/附件) 中，随时可点击下载！"
          echo "如需直接发布到 Releases 标签页，请进入仓库 Settings -> Actions -> General -> Workflow permissions 勾选 'Read and write permissions' 并保存。"
