name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/watermark-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watermark-app-apk
          path: release-assets/watermark-app.apk

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "水印添加器 ${{ steps.get_tag.outputs.tag }}"
          body: |
            ## 📱 水印添加器 Android APK 发布

            本安装包由 GitHub Actions 自动化流水线构建。
            
            ### ✨ 安装说明
            1. 在下方 **Assets** 列表中下载 `watermark-app.apk`
            2. 在安卓手机上打开并允许安装
            3. 支持离线全屏使用、自定水印、批量照片处理与高清导出
          draft: false
          prerelease: false
          files: release-assets/watermark-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
